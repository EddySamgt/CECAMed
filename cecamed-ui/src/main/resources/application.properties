spring.application.name=cecamed-ui

# Datasource Configuration (Portable dev database with PostgreSQL compatibility)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/cecamed_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=false

# Google Calendar default properties
cecamed.google.calendar.enabled=false
cecamed.google.calendar.calendar-id=primary
cecamed.google.calendar.credentials-file-path=credentials.json
cecamed.google.calendar.tokens-directory-path=tokens

# Storage properties for attachments
cecamed.storage.base-dir=./uploads/cecamed/documents
