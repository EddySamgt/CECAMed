spring.application.name=cecamed-ui
spring.config.import=optional:file:./.env[.utf8]

# PostgreSQL (credentials supplied through the environment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cecamed_db_eddy}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.main.web-application-type=none

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Google Calendar default properties
cecamed.google.calendar.enabled=false
cecamed.google.calendar.calendar-id=primary
cecamed.google.calendar.credentials-path=credentials.json
cecamed.google.calendar.tokens-directory-path=tokens

# Storage properties for attachments
cecamed.storage.upload-dir=${CECAMED_STORAGE_UPLOAD_DIR:./uploads/cecamed/documents}
